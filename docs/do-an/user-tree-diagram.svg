<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sơ đồ phân quyền người dùng website trung tâm tiếng Anh</title>
<desc>Cây phân quyền gồm 4 vai trò: Khách, Học viên, Giáo viên, Admin, mỗi vai trò có các quyền riêng</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<style>
  text { font-family: Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .box-gray  { fill: #F1EFE8; stroke: #5F5E5A; }
  .box-teal  { fill: #E1F5EE; stroke: #0F6E56; }
  .box-amber { fill: #FAEEDA; stroke: #854F0B; }
  .box-coral { fill: #FAECE7; stroke: #993C1D; }
  .txt-gray  { fill: #2C2C2A; }
  .txt-teal  { fill: #04342C; }
  .txt-amber { fill: #412402; }
  .txt-coral { fill: #4A1B0C; }
  .line { stroke: #5F5E5A; stroke-width: 0.5; fill: none; }
</style>

<!-- Root -->
<rect x="220" y="40" width="240" height="44" rx="8" class="box-gray"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" class="th txt-gray">Website trung tâm tiếng Anh</text>

<!-- Trunk + branch lines -->
<line x1="340" y1="84" x2="340" y2="110" class="line"/>
<line x1="105" y1="110" x2="555" y2="110" class="line"/>
<line x1="105" y1="110" x2="105" y2="130" class="line" marker-end="url(#arrow)"/>
<line x1="255" y1="110" x2="255" y2="130" class="line" marker-end="url(#arrow)"/>
<line x1="405" y1="110" x2="405" y2="130" class="line" marker-end="url(#arrow)"/>
<line x1="555" y1="110" x2="555" y2="130" class="line" marker-end="url(#arrow)"/>

<!-- Khách -->
<rect x="40" y="130" width="130" height="118" rx="8" class="box-gray"/>
<text x="105" y="150" text-anchor="middle" dominant-baseline="central" class="th txt-gray">Khách</text>
<text x="105" y="172" text-anchor="middle" class="ts txt-gray">
  <tspan x="105" dy="0">Xem khóa học</tspan>
  <tspan x="105" dy="16">Làm test trình độ</tspan>
  <tspan x="105" dy="16">Gửi liên hệ</tspan>
</text>

<!-- Học viên -->
<rect x="190" y="130" width="130" height="118" rx="8" class="box-teal"/>
<text x="255" y="150" text-anchor="middle" dominant-baseline="central" class="th txt-teal">Học viên</text>
<text x="255" y="172" text-anchor="middle" class="ts txt-teal">
  <tspan x="255" dy="0">Đăng ký học</tspan>
  <tspan x="255" dy="16">Xem lịch học</tspan>
  <tspan x="255" dy="16">Thanh toán</tspan>
</text>

<!-- Giáo viên -->
<rect x="340" y="130" width="130" height="118" rx="8" class="box-amber"/>
<text x="405" y="150" text-anchor="middle" dominant-baseline="central" class="th txt-amber">Giáo viên</text>
<text x="405" y="172" text-anchor="middle" class="ts txt-amber">
  <tspan x="405" dy="0">Xem lớp dạy</tspan>
  <tspan x="405" dy="16">Cập nhật hồ sơ</tspan>
</text>

<!-- Admin -->
<rect x="490" y="130" width="130" height="118" rx="8" class="box-coral"/>
<text x="555" y="150" text-anchor="middle" dominant-baseline="central" class="th txt-coral">Admin</text>
<text x="555" y="172" text-anchor="middle" class="ts txt-coral">
  <tspan x="555" dy="0">QL khóa học</tspan>
  <tspan x="555" dy="16">QL người dùng</tspan>
  <tspan x="555" dy="16">QL tin tức</tspan>
</text>
</svg>
